name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Package
        run: mvn -B package
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: NajlepszeServeryMC-Rewards
          path: target/NajlepszeServeryMC-Rewards-*.jar
      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: target/NajlepszeServeryMC-Rewards-*.jar
          generate_release_notes: true
